<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
		THESIS: An instrument, not an ornament. The clock is the only statement; the
		category default (skeuomorphic split-flap machinery) is refused.
		OWN-WORLD: True black ground, one flat plate color, one digit color, a hairline
		seam. System grotesk digits, tabular. Depth exists only while a flap moves.
		The settings sheet is neutral dark chrome; only the accent and the theme
		swatches carry color.
		STORY: The viewer reads the time at a glance and forgets the interface exists.
		A long press reveals a small, finished settings sheet; it leaves on its own.
		FIRST VIEWPORT: Two plates centered on black, nothing else. Optional seconds
		half-size, optional date line below at low opacity.
		FORM: Minimal flat flip clock, the project's original direction, restored and
		refined. Pinned by the owner.
		FINISH: unreviewed and undocumented is unfinished; this build ends with the
		finish review, the verdict, DESIGN.md, and every shipping raster carrying its
		provenance.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
