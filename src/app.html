<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#000000" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
		THESIS: An instrument, not an ornament. One face at a time is the only
		statement, clock or focus timer on the same plates; the category default
		(skeuomorphic split-flap machinery) is refused.
		OWN-WORLD: True black ground, one flat plate color, one digit color, a hairline
		seam. Self-hosted Roboto digit subset at 600, equal advances, system grotesk
		fallback. Depth exists only while a flap moves. The settings sheet is neutral
		dark chrome (shadcn-svelte controls); only the accent and the theme swatches
		carry color.
		STORY: The viewer reads the time at a glance and forgets the interface exists.
		A swipe slides to a focus timer on the same plates; tap starts it. A long
		press reveals a small, finished settings sheet; it leaves on its own.
		FIRST VIEWPORT: Two plates centered on black, nothing else. Optional seconds
		half-size, optional subline below at low opacity.
		FORM: Minimal flat flip clock, the project's original direction, restored and
		refined. Pinned by the owner.
		FINISH: unreviewed and undocumented is unfinished; this build ends with the
		finish review, the verdict, DESIGN.md, and every shipping raster carrying its
		provenance.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
