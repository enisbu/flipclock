<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<rect width="512" height="512" fill="#000" />
	<!-- One plate, wider than tall like the real face. The hinge slot across the
	     middle is the whole idea, cut wide enough to survive a 48 pixel favicon. -->
	<rect x="104" y="140" width="304" height="232" rx="26" fill="#f2f2f2" />
	<rect x="104" y="242" width="304" height="28" fill="#000" />
	<!-- The two axis pins the real clock face carries, so icon and product match. -->
	<circle cx="104" cy="256" r="27" fill="#000" />
	<circle cx="408" cy="256" r="27" fill="#000" />
	<circle cx="104" cy="256" r="12" fill="#f2f2f2" />
	<circle cx="408" cy="256" r="12" fill="#f2f2f2" />
</svg>
