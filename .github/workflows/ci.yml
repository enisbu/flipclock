name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # svelte-check must report 0 errors and 0 warnings. The repo baseline is
      # clean and stays that way, so a warning fails the build like an error.
      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser is 27 of this job's 58 seconds, so it gets cached. The key is
      # the lockfile: a playwright bump has to pull the matching browser, and a
      # stale one would fail with "Executable doesn't exist", so no restore-keys.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # No --with-deps: the ubuntu runner image already carries the libraries
      # chromium links against, and installing them anyway costs 26 seconds of apt.
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # Runs against the production build, which the playwright config starts
      # itself. The service worker has no real assets under vite dev.
      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
